name: 🚀 hugo publish

on:
  push:
    branches:
    - main

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Git checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        submodules: recursive
        persist-credentials: false

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@d1c81a15d4e6dca7086a17b9c2565cb70fd576bf # v3.3.0
      with:
        hugo-version: '0.170.0'

    - name: Build
      run: hugo  --enableGitInfo --minify

    - name: Add unlisted deployment stacks preview
      env:
        PREVIEW_DIR: ${{ runner.temp }}/blog-draft-preview
      run: |
        hugo --enableGitInfo --minify --buildDrafts --destination "$PREVIEW_DIR"
        mkdir -p public/posts/deployment-stacks
        cp "$PREVIEW_DIR/posts/deployment-stacks/index.html" public/posts/deployment-stacks/index.html

    - name: Deploy to GitHub Pages
      uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
      with:
        target_branch: gh-pages
        build_dir: public
        fqdn: anotherdevops.blog
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}