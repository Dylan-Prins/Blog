baseURL: "https://anotherdevops.blog/"
title: Another DevOps Blog
theme: beautifulhugo

DefaultContentLanguage: en

enableInlineShortcodes: true
enableRobotsTXT: true
enableGitInfo: false
enableEmoji: true
buildDrafts: false
buildFuture: false
buildExpired: false

pagination:
  pagerSize: 5

taxonomies:
  category: categories
  tag: tags
  series: series

outputs:
  home:
    - HTML
    - RSS
    - JSON
  section:
    - HTML
    - RSS
  page:
    - HTML

params:
  subtitle: "A blog about DevOps stuff that I find interesting. I hope you find it interesting too."
  mainSections:
    - posts
  logo: "https://raw.githubusercontent.com/Dylan-Prins/Blog/main/assets/images/favicon.png"
  favicon: "https://raw.githubusercontent.com/Dylan-Prins/Blog/main/assets/images/favicon.png"
  dateFormat: ":date_long"
  rss: true
  readingTime: true
  wordCount: true
  colorScheme: "auto"
  socialShare: true
  showRelatedPosts: true
  commit: false

  search:
    provider: fuse

  author:
    name: Dylan Prins
    github: Dylan-Prins
    linkedin: in/dylan-prins-a50b01115

menu:
  main:
    - identifier: posts
      name: Posts
      url: posts/
      weight: 1
    - identifier: tags
      name: Tags
      url: tags/
      weight: 2
    - identifier: archives
      name: Archive
      url: archives/
      weight: 3
    - identifier: search
      name: Search
      url: search/
      weight: 4

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
  highlight:
    noClasses: false

privacy:
  vimeo:
    disabled: true
    simple: true
  x:
    disabled: false
    enableDNT: true
    simple: true
  instagram:
    disabled: true
    simple: true
  youtube:
    disabled: true
    privacyEnhanced: true

services:
  instagram:
    disableInlineCSS: true
  x:
    disableInlineCSS: false
